aid: aftershoot
name: AfterShoot
description: Aftershoot is a Techstars-backed company building desktop AI software for professional
  photographers that automates the post-shoot workflow. Its applications cull large photo sets by
  detecting duplicates, blinks, blur, and composition to pick the best frames, apply personalized
  AI editing that learns a photographer's style, and perform AI retouching, plus tools for building
  client galleries and selects. Aftershoot integrates with Adobe Lightroom Classic and Capture One
  and runs locally on macOS and Windows. There is no public web API, developer portal, or OpenAPI
  surface; the public code presence is internal Rust/Kotlin tooling on GitHub.
